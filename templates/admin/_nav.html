<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <nav class="nav nav-pills gap-1" aria-label="Admin">
        <a class="nav-link {{ 'active' if request.endpoint in ('admin_home',) }}" href="{{ url_for('admin_home') }}"><i class="bi bi-shop me-1"></i>Stores</a>
        <a class="nav-link {{ 'active' if request.endpoint == 'admin_gifts' }}" href="{{ url_for('admin_gifts') }}"><i class="bi bi-receipt me-1"></i>Gifts &amp; refunds</a>
        <a class="nav-link {{ 'active' if request.endpoint == 'admin_sms' }}" href="{{ url_for('admin_sms') }}"><i class="bi bi-chat-dots me-1"></i>SMS log</a>
    </nav>
    <form method="POST" action="{{ url_for('admin_logout') }}">{{ csrf_field() }}
        <button class="btn btn-outline-dark btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button></form>
</div>
